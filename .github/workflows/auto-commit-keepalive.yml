name: Auto Commit Keepalive

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create keepalive file
        run: |
          echo "Last updated: $(date)" > .keepalive
          
      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .keepalive
          git diff --quiet && git diff --staged --quiet || git commit -m "Keepalive: $(date)"
          git push
