name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 * * *"   # Once per day at midnight (Hobby tier limit)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          curl -X GET "https://thefrequencylive.org/api/system/keepalive" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --silent --output /dev/null
          echo "✅ Keep-alive ping successful at $(date)"
