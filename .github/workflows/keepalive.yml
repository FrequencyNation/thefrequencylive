name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours (GitHub free tier allows this)
  workflow_dispatch:          # Manual trigger option

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          curl -X GET "https://thefrequencylive.org/api/system/keepalive" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --silent --output /dev/null
          echo "Keep-alive ping successful at $(date)"
